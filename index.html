<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Sorry my queen</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap">
<style>
:root {
  --bg: #fdf3f5;
  --bg-glow-1: rgba(255, 170, 190, 0.45);
  --bg-glow-2: rgba(255, 210, 170, 0.35);
  --fg: #2a1f22;
  --muted: #7a6269;
  --accent: #b12d55;
  --accent-2: #e8688c;
  --card: rgba(255, 255, 255, 0.72);
  --line: rgba(177, 45, 85, 0.15);
  --shadow: rgba(177, 45, 85, 0.25);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a1215;
    --bg-glow-1: rgba(180, 40, 80, 0.35);
    --bg-glow-2: rgba(120, 60, 40, 0.25);
    --fg: #f6ebe7;
    --muted: #b9a0a7;
    --accent: #f07a9c;
    --accent-2: #ffa3bd;
    --card: rgba(38, 28, 32, 0.75);
    --line: rgba(240, 122, 156, 0.2);
    --shadow: rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1a1215;
  --bg-glow-1: rgba(180, 40, 80, 0.35);
  --bg-glow-2: rgba(120, 60, 40, 0.25);
  --fg: #f6ebe7;
  --muted: #b9a0a7;
  --accent: #f07a9c;
  --accent-2: #ffa3bd;
  --card: rgba(38, 28, 32, 0.75);
  --line: rgba(240, 122, 156, 0.2);
  --shadow: rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at 15% 10%, var(--bg-glow-1), transparent 45%),
    radial-gradient(circle at 85% 90%, var(--bg-glow-2), transparent 45%),
    var(--bg);
  color: var(--fg);
  font-family: "Tajawal", system-ui, sans-serif;
  font-size: 17px;
  line-height: 1.9;
  padding-block: 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-x: hidden;
}

main {
  position: relative;
  z-index: 1;
  max-width: 640px;
  margin: 0 auto;
  text-align: center;
}

/* Falling petals in the background */
.petals {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}
.petals span {
  position: absolute;
  top: -10%;
  font-size: 1.2rem;
  opacity: 0.6;
  animation: fall linear infinite;
}
.petals span:nth-child(1) { left: 5%;  animation-duration: 13s; animation-delay: -2s;  font-size: 1rem; }
.petals span:nth-child(2) { left: 18%; animation-duration: 17s; animation-delay: -7s; }
.petals span:nth-child(3) { left: 32%; animation-duration: 11s; animation-delay: -4s;  font-size: 0.9rem; }
.petals span:nth-child(4) { left: 46%; animation-duration: 15s; animation-delay: -9s; }
.petals span:nth-child(5) { left: 60%; animation-duration: 12s; animation-delay: -1s;  font-size: 1.1rem; }
.petals span:nth-child(6) { left: 74%; animation-duration: 18s; animation-delay: -11s; }
.petals span:nth-child(7) { left: 88%; animation-duration: 14s; animation-delay: -5s;  font-size: 0.95rem; }
.petals span:nth-child(8) { left: 95%; animation-duration: 16s; animation-delay: -8s; }

.flowers {
  font-size: 1.6rem;
  letter-spacing: 0.4em;
  margin-bottom: 8px;
}
.flowers span {
  display: inline-block;
  animation: sway 4s ease-in-out infinite;
}
.flowers span:nth-child(2) { animation-delay: -1s; }
.flowers span:nth-child(3) { animation-delay: -2s; }
.flowers span:nth-child(4) { animation-delay: -3s; }

h1 {
  font-size: clamp(2rem, 8vw, 3.2rem);
  font-weight: 900;
  line-height: 1.3;
  margin: 0 0 0.3em;
  color: var(--accent);
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 4px 14px var(--shadow));
  text-wrap: balance;
}

/* Frosted glass card */
.card {
  position: relative;
  overflow: hidden;
  background: var(--card);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: 32px 26px;
  margin-top: 16px;
  box-shadow: 0 24px 60px -24px var(--shadow);
}

.bloom {
  font-size: 4.5rem;
  line-height: 1.2;
  min-height: 1.4em;
  filter: drop-shadow(0 10px 20px var(--shadow));
  animation: bob 3.5s ease-in-out infinite;
}
.bloom.pop {
  animation: pop 0.45s ease-out, bob 3.5s ease-in-out 0.45s infinite;
}

.msg {
  font-size: 1.25rem;
  font-weight: 700;
  min-height: 3.2em;
  margin: 8px 0 14px;
  text-wrap: balance;
}
.card.done .msg {
  color: var(--accent);
}

/* Five hearts that fill in as the messages go by */
.progress {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin: 0 0 20px;
}
.progress span {
  font-size: 1.2rem;
  filter: grayscale(1);
  opacity: 0.35;
  transition: filter 0.3s ease, opacity 0.3s ease, transform 0.3s ease;
}
.progress span.on {
  filter: none;
  opacity: 1;
  transform: scale(1.15);
}

button {
  font: inherit;
  font-weight: 700;
  color: #fff;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  border: 0;
  border-radius: 999px;
  padding: 14px 32px;
  min-height: 48px;
  box-shadow: 0 10px 24px -8px var(--shadow);
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  position: relative;
  overflow: hidden;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
button::after {
  content: "";
  position: absolute;
  top: 0;
  left: -75%;
  width: 50%;
  height: 100%;
  background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.45), transparent);
  transform: skewX(-20deg);
  transition: left 0.6s ease;
}
button:hover::after {
  left: 125%;
}
button:hover {
  transform: translateY(-2px);
  box-shadow: 0 14px 28px -8px var(--shadow);
}
button:active {
  transform: scale(0.97);
}
button:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 3px;
}

/* Hearts that burst out of the card on each press */
.burst {
  position: absolute;
  left: 50%;
  top: 38%;
  font-size: 1.1rem;
  pointer-events: none;
  animation: burst 1s ease-out forwards;
}

footer {
  margin-top: 36px;
  color: var(--muted);
  font-size: 0.95rem;
}

/* Sealed letter that opens before the page */
.envelope-wrap {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: radial-gradient(circle at 50% 30%, #3a1823, #140b0e);
  transition: opacity 0.8s ease, visibility 0.8s;
}
.envelope-wrap.gone {
  opacity: 0;
  visibility: hidden;
}
.letter {
  position: relative;
  width: min(82vw, 340px);
  height: 210px;
  background: linear-gradient(145deg, #fff4f6, #f7d9e0);
  border-radius: 12px;
  box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  padding-bottom: 22px;
  color: #7a0f2c;
}
.letter .flap {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 50%;
  background: linear-gradient(#e8a3b4, #d97a93);
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  border-radius: 12px 12px 0 0;
  transform-origin: top center;
  transition: transform 0.8s ease;
}
.letter.open .flap {
  transform: rotateX(180deg);
}
.seal {
  position: absolute;
  top: 46%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 64px;
  height: 64px;
  min-height: 0;
  padding: 0;
  border-radius: 50%;
  font-size: 1.6rem;
  background: radial-gradient(circle at 35% 35%, #d62d5a, #7a0f2c);
  box-shadow: 0 8px 18px rgba(0, 0, 0, 0.35);
}
/* Keep the seal still under hover and press; only the click moves it */
.seal,
.seal:hover,
.seal:active {
  transform: translate(-50%, -50%);
}
.letter.open .seal {
  transform: translate(-50%, -170%) scale(1.2);
  opacity: 0;
  transition: transform 0.6s ease, opacity 0.6s ease;
}
.seal::after {
  display: none;
}
.letter p {
  margin: 0;
  font-weight: 700;
}

/* The page fades in once the letter is opened */
main {
  transition: opacity 1s ease, transform 1s ease;
}
body:not(.opened) main {
  opacity: 0;
  transform: translateY(20px);
}
body.opened main {
  opacity: 1;
  transform: none;
}

/* Slow glowing blobs behind everything */
.blobs {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}
.blobs span {
  position: absolute;
  top: -80px;
  left: -100px;
  width: 320px;
  height: 320px;
  border-radius: 50%;
  background: var(--accent-2);
  filter: blur(70px);
  opacity: 0.28;
  animation: drift 22s ease-in-out infinite;
}
.blobs span:nth-child(2) {
  top: auto;
  left: auto;
  bottom: -120px;
  right: -90px;
  background: var(--accent);
  animation-duration: 28s;
  animation-delay: -10s;
}
.blobs span:nth-child(3) {
  top: 40%;
  left: 55%;
  width: 220px;
  height: 220px;
  background: #ffd0a8;
  animation-duration: 34s;
  animation-delay: -4s;
}

/* Sparkles around the flower */
.sparkle {
  position: absolute;
  font-size: 1rem;
  pointer-events: none;
  animation: twinkle 2.4s ease-in-out infinite;
}
.sparkle.a { top: 12%; left: 12%; }
.sparkle.b { top: 22%; right: 14%; font-size: 0.8rem; animation-delay: -1.2s; }
.sparkle.c { bottom: 18%; left: 18%; font-size: 0.85rem; animation-delay: -0.6s; }

/* Hearts and roses falling after she forgives */
.rain {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 2;
}
.rain span {
  position: absolute;
  top: -10%;
  font-size: 1.1rem;
  animation: rainfall linear forwards;
}

/* Blinking cursor while the message types out */
.typing::after {
  content: "|";
  margin-inline-start: 2px;
  opacity: 0.6;
  animation: blink 1s steps(1) infinite;
}

@keyframes drift {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(60px, -40px) scale(1.1); }
}
@keyframes twinkle {
  0%, 100% { opacity: 0.2; transform: scale(0.7) rotate(0deg); }
  50% { opacity: 1; transform: scale(1.1) rotate(20deg); }
}
@keyframes rainfall {
  to { transform: translateY(115vh) rotate(180deg); }
}
@keyframes blink {
  50% { opacity: 0; }
}

@keyframes sway {
  0%, 100% { transform: rotate(-6deg); }
  50% { transform: rotate(6deg); }
}
@keyframes pop {
  0% { transform: scale(0.6); opacity: 0; }
  70% { transform: scale(1.12); opacity: 1; }
  100% { transform: scale(1); }
}
@keyframes bob {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}
@keyframes fall {
  from { transform: translateY(0) rotate(0deg); }
  to { transform: translateY(120vh) rotate(360deg); }
}
@keyframes burst {
  from { transform: translate(-50%, -50%) scale(0.4); opacity: 1; }
  to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1); opacity: 0; }
}

/* Phone layout: bigger touch targets, tighter spacing, nothing wider than the screen */
@media (max-width: 480px) {
  body {
    font-size: 16px;
    padding-block: 28px;
  }
  h1 {
    font-size: 1.9rem;
  }
  .flowers {
    font-size: 1.3rem;
    letter-spacing: 0.25em;
  }
  .card {
    padding: 24px 18px;
  }
  .bloom {
    font-size: 3.6rem;
  }
  .msg {
    font-size: 1.1rem;
    min-height: 4em;
  }
  button {
    width: 100%;
    font-size: 1.05rem;
  }
}

@media (prefers-reduced-motion: reduce) {
  .petals span, .flowers span, .bloom, .bloom.pop, .burst,
  .blobs span, .sparkle, .rain span, .typing::after {
    animation: none !important;
  }
}
</style>

<div class="petals" aria-hidden="true"><span>🌸</span><span>🌷</span><span>🌹</span><span>🌺</span><span>🌸</span><span>🌷</span><span>🌹</span><span>🌺</span></div>

<div class="envelope-wrap" id="envelope">
  <div class="letter" id="letter">
    <div class="flap"></div>
    <button class="seal" id="open" type="button" aria-label="افتحي الرسالة">🌹</button>
    <p>افتحي الرسالة</p>
  </div>
</div>

<div class="blobs" aria-hidden="true"><span></span><span></span><span></span></div>
<div class="rain" id="rain" aria-hidden="true"></div>

<main dir="rtl" lang="ar">
  <div class="flowers" aria-hidden="true"><span>🌹</span><span>🌸</span><span>🌷</span><span>💐</span><span>🌼</span></div>
  <h1>ملكتي، بدي اعتذر</h1>

  <div class="card" id="card">
    <span class="sparkle a" aria-hidden="true">✨</span>
    <span class="sparkle b" aria-hidden="true">✨</span>
    <span class="sparkle c" aria-hidden="true">✨</span>
    <div class="bloom" id="bloom" aria-hidden="true">🌼</div>
    <p class="msg" id="msg" aria-live="polite">بدي اعتذرلك بطريقتي</p>
    <div class="progress" id="progress" aria-hidden="true"><span>❤️</span><span>❤️</span><span>❤️</span><span>❤️</span><span>❤️</span></div>
    <button id="next" type="button">كملي</button>
  </div>

  <footer>آسف من كل قلبي</footer>
</main>

<script>
  (function () {
    var steps = [
      { f: "🌹", t: "ولا وردة تكفي تعتذرلك، بس هاي أول وردة." },
      { f: "🌸", t: "عارف إني غلطت، وما بدي أبرر ولا كلمة." },
      { f: "🌷", t: "لو فيني ارجع بالوقت كنت ما غلطت هالغلط التافه متلي" },
      { f: "💐", t: "إنتي أغلى شي عندي، وما بدي أخسرك." },
      { f: "🤍", t: "سامحتيني ملكتي؟" }
    ];
    var thanks = [
      "شكرا كتييير ملكتي ❤️❤️"
    ];
    // one soft note per step, rising like a small melody
    var notes = [523.25, 587.33, 659.25, 783.99, 880];

    var card = document.getElementById("card");
    var bloom = document.getElementById("bloom");
    var msg = document.getElementById("msg");
    var button = document.getElementById("next");
    var dots = document.querySelectorAll("#progress span");
    var pressed = 0;     // how many apology steps have been shown (0..5)
    var thanksIndex = 0;
    var audioCtx = null;
    var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    // Synthesized tones (no audio file needed). The browser only allows sound
    // after a click, so the first press creates the audio context.
    function play(freqs) {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === "suspended") audioCtx.resume();
        var now = audioCtx.currentTime;
        freqs.forEach(function (f, i) {
          var start = now + i * 0.12;
          var osc = audioCtx.createOscillator();
          var gain = audioCtx.createGain();
          osc.type = "sine";
          osc.frequency.value = f;
          gain.gain.setValueAtTime(0.0001, start);
          gain.gain.exponentialRampToValueAtTime(0.18, start + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, start + 1.0);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(start);
          osc.stop(start + 1.05);
        });
      } catch (e) {
        // Sound is unavailable here; the page still works without it.
      }
    }

    // Types the message out one character at a time.
    var typeTimer = null;
    function typeText(text) {
      if (typeTimer) clearInterval(typeTimer);
      if (reduceMotion) {
        msg.textContent = text;
        return;
      }
      var i = 0;
      msg.textContent = "";
      msg.classList.add("typing");
      typeTimer = setInterval(function () {
        i += 1;
        msg.textContent = text.slice(0, i);
        if (i >= text.length) {
          clearInterval(typeTimer);
          typeTimer = null;
          msg.classList.remove("typing");
        }
      }, 35);
    }

    function show(flower, text) {
      bloom.textContent = flower;
      typeText(text);
      bloom.classList.remove("pop");
      void bloom.offsetWidth; // restart the animation
      bloom.classList.add("pop");
    }

    // A shower of hearts and roses falling down the whole page.
    function rain() {
      if (reduceMotion) return;
      var layer = document.getElementById("rain");
      var pieces = ["❤️", "💗", "🌹", "🌸", "✨"];
      for (var i = 0; i < 28; i++) {
        var s = document.createElement("span");
        s.textContent = pieces[i % pieces.length];
        s.style.left = (Math.random() * 100).toFixed(1) + "%";
        s.style.animationDuration = (2.5 + Math.random() * 2.5).toFixed(2) + "s";
        s.style.animationDelay = (Math.random() * 1.2).toFixed(2) + "s";
        s.addEventListener("animationend", function (e) { e.currentTarget.remove(); });
        layer.appendChild(s);
      }
    }

    function burst() {
      if (reduceMotion) return;
      for (var i = 0; i < 8; i++) {
        var h = document.createElement("span");
        h.className = "burst";
        h.textContent = i % 2 ? "💗" : "❤️";
        var angle = (Math.PI * 2 * i) / 8;
        var dist = 90 + Math.random() * 40;
        h.style.setProperty("--dx", (Math.cos(angle) * dist).toFixed(0) + "px");
        h.style.setProperty("--dy", (Math.sin(angle) * dist).toFixed(0) + "px");
        h.addEventListener("animationend", function (e) { e.currentTarget.remove(); });
        card.appendChild(h);
      }
    }

    // Opening the sealed letter: flap lifts, then the page fades in.
    var letter = document.getElementById("letter");
    var envelope = document.getElementById("envelope");
    var openBtn = document.getElementById("open");
    var opening = false;
    openBtn.addEventListener("click", function () {
      if (opening) return;
      opening = true;
      letter.classList.add("open");
      play([523.25, 659.25, 783.99, 1046.5]);
      setTimeout(function () {
        envelope.classList.add("gone");
        document.body.classList.add("opened");
      }, 900);
    });

    button.addEventListener("click", function () {
      if (pressed < steps.length) {
        var idx = pressed;
        var step = steps[idx];
        pressed += 1;
        show(step.f, step.t);
        for (var j = 0; j < pressed; j++) dots[j].classList.add("on");
        burst();
        if (pressed === steps.length) {
          button.textContent = "إيه، سامحتك";
          card.classList.add("done");
          play([659.25, 783.99, 987.77]); // warm chord for the question
        } else {
          play([notes[idx]]);
        }
      } else {
        show("❤️", thanks[thanksIndex % thanks.length]);
        thanksIndex += 1;
        burst();
        rain();
        play([783.99, 987.77, 1174.66]); // bright chord for the thank-you
      }
    });
  })();
</script>
